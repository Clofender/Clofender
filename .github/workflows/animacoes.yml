# ═══════════════════════════════════════════════════════════════════════════
#  Gera as animações do perfil:
#
#    JOB 1 → 🐍 cobrinha                      → branch "output"
#    JOB 2 → 📊 gráfico 3D de contribuições   → branch "main"
#
#  ── POR QUE DOIS JOBS E NÃO DOIS ARQUIVOS? ────────────────────────────────
#  A cobrinha publica na branch "output"; o 3D publica na "main". Rodando em
#  jobs separados (cada um com sua própria máquina e seu próprio checkout),
#  um não mexe no arquivo do outro. Se estivessem no mesmo job, o "git add -A"
#  do 3D acabaria levando junto os arquivos da cobrinha.
#
#  ── POR QUE ISSO NUNCA QUEBRA ─────────────────────────────────────────────
#  Os SVGs são gravados DENTRO do seu repositório. O README aponta para
#  raw.githubusercontent.com — o CDN do próprio GitHub. Não depende de
#  Vercel, nem de servidor de terceiros que possa cair.
#
#  ── COMO USAR ────────────────────────────────────────────────────────────
#  1. Crie este arquivo em  .github/workflows/animacoes.yml
#  2. Faça o commit — o workflow já dispara sozinho
#  3. Confira em "Actions" se rodou (se aparecer um botão verde de
#     "enable workflows", clique nele primeiro)
#  4. Espere ~2 minutos e recarregue a página do perfil
# ═══════════════════════════════════════════════════════════════════════════

name: 🐍📊 Gerar animações do perfil

on:
  schedule:
    # Todo dia às 03:00 UTC (meia-noite no horário de Brasília)
    - cron: "0 3 * * *"
  workflow_dispatch: # botão "Run workflow", para rodar na hora que quiser
  push:
    branches: [main]

jobs:
  # ═════════════════════════════════════════════════════════════════════════
  #  JOB 1 — COBRINHA + PACMAN  →  branch "output"
  # ═════════════════════════════════════════════════════════════════════════
  cobrinha:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ⚠️ OBRIGATÓRIO: cria a pasta dist/ antes das actions rodarem.
      #    Sem isto o job quebra com "EACCES: permission denied, open
      #    'dist/pacman-contribution-graph.svg'". Motivo: a action da cobrinha
      #    (Platane/snk) é uma action DOCKER e roda como root, então ela cria a
      #    pasta dist/ dona dela. A do pacman roda como o usuário "runner" e
      #    não consegue escrever numa pasta que não é dele. Criando dist/ aqui,
      #    a pasta pertence ao runner e as duas conseguem escrever nela.
      - name: 📁 Preparar a pasta de saída
        run: |
          mkdir -p dist
          chmod 777 dist

      # As cores ficam gravadas dentro do SVG (o serviço não aceita cor por
      # query string). São 5 tons, do menor pro maior número de contribuições:
      #   #071F17 (zero) → #0B6E4F → #12A36F → #1FD98A → #39FF14 (máximo)
      - name: 🐍 Gerar a cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: Clofender
          outputs: |
            dist/cobrinha.svg?color_snake=#39FF14&color_dots=#071F17,#0B6E4F,#12A36F,#1FD98A,#39FF14

      # Publica a pasta dist/ inteira na branch "output"
      - name: 🚀 Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ═════════════════════════════════════════════════════════════════════════
  #  JOB 2 — GRÁFICO 3D DE CONTRIBUIÇÕES  →  branch "main"
  # ═════════════════════════════════════════════════════════════════════════
  grafico-3d:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Baixar o repositório
        uses: actions/checkout@v5

      # Esta action gera 10 variações de uma vez, na pasta profile-3d-contrib/
      # A que o README usa é a "profile-green-animate.svg" (verde e animada).
      - name: 📊 Gerar o gráfico 3D
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: 💾 Commitar o resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A .
          if git commit -m "📊 Atualiza o gráfico 3D de contribuições [skip ci]"; then
            git push
          fi

# ───────────────────────────────────────────────────────────────────────────
#  ONDE OS ARQUIVOS FICAM DEPOIS DE RODAR:
#
#    https://raw.githubusercontent.com/Clofender/Clofender/output/cobrinha.svg
#    https://raw.githubusercontent.com/Clofender/Clofender/output/pacman-contribution-graph-dark.svg
#    https://raw.githubusercontent.com/Clofender/Clofender/main/profile-3d-contrib/profile-green-animate.svg
#
#  O push usa o GITHUB_TOKEN, e o GitHub não deixa um push feito com esse
#  token disparar o workflow de novo — ou seja, não entra em loop infinito.
# ───────────────────────────────────────────────────────────────────────────
